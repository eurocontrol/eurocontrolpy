[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eurocontrolpy"
version = "0.0.1"
description = "EUROCONTROL PRISME/NM Oracle client for trajectories and airspace profiles (SO6 generation included)."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Enrico Spinielli", email = "enrico.spinielli@eurocontrol.int" },
  { name = "Quinten Goens", email = "quinten.goens@eurocontrol.int" }
]

license = { text = "MIT" }
requires-python = ">=3.8"

# Core runtime dependencies actually used by the code you provided
dependencies = [
  "pandas>=1.5",
  "sqlalchemy>=2.0",
  "oracledb>=1.4",
  "requests>=2.28"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

keywords = [
  "aviation",
  "eurocontrol",
  "prisme",
  "oracle",
  "sqlalchemy",
  "flights",
  "trajectories",
  "airspace-profiles",
  "so6"
]

maintainers = [
  { name = "Quinten Goens", email = "quinten.goens@eurocontrol.int" }
]

[project.urls]
# Update these when you publish the repo for this package
Homepage = "https://github.com/eurocontrol/eurocontrolpy"
Repository = "https://github.com/eurocontrol/eurocontrolpy.git"
Issues = "https://github.com/eurocontrol/eurocontrolpy/issues"

[project.optional-dependencies]
# Geodesic distance backend; code gracefully falls back to Haversine if missing
geo = ["geopy>=2.3"]
# Required for airspace geometry methods (acc_sf, ansp_sf, es_sf, fir_sf)
geo_shapes = ["geopandas>=0.13"]
# Required for polyfill_h3(); h3-py v3 and v4 are both supported
h3 = ["h3>=3.7"]
# PySpark backend
spark = ["pyspark>=3.3"]
# Documentation build
docs = [
  "sphinx>=7.2",
  "furo>=2024.1",
  "sphinx-copybutton>=0.5",
  "myst-parser>=3.0",
  # sphinx-autodoc-typehints is intentionally excluded: autodoc_typehints =
  # "description" (Sphinx 7 built-in) handles the same job without conflicts.
]
# Development tools (linting + formatting)
dev = [
  "ruff>=0.4",
  "eurocontrolpy[docs]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eurocontrolpy" = ["data/*.csv"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "Q",   # flake8-quotes
]
ignore = [
  "E501",  # line-too-long — SQL strings are intentionally long
  "N802",  # function-name lowercase — SQL column names are UPPER_CASE
  "N803",  # argument-name lowercase — same
  "UP007", # use X | Y for unions — keep Union[] for explicit py3.8 compat
]

[tool.ruff.lint.per-file-ignores]
"src/eurocontrolpy/_base.py"       = ["E501"]
"src/eurocontrolpy/eurocontrolpy.py" = ["E501"]