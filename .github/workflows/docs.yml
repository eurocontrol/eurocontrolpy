name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      # Re-build whenever source or docs change
      - "eurocontrolpy/src/**"
      - "eurocontrolpy/docs/**"
      - "eurocontrolpy/pyproject.toml"
  workflow_dispatch:   # allow manual trigger from the Actions tab

# Permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; skip queued runs but don't cancel in-progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eurocontrolpy   # all commands run from package root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eurocontrolpy/pyproject.toml

      - name: Install package + docs dependencies
        run: pip install -e ".[docs]"

      - name: Build HTML documentation
        # -W  treats warnings as errors (catches broken directives, bad autodoc)
        # --keep-going  shows all errors instead of stopping at the first one
        # -n is intentionally omitted: it enables nit-picky mode which turns
        #    every unresolved cross-reference into a warning → error, including
        #    those that reference mocked optional-dependency types (pyspark, etc.)
        run: |
          sphinx-build \
            -b html \
            -W --keep-going \
            docs \
            docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: eurocontrolpy/docs/_build/html

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
